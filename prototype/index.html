<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle de Sport - Disciplines</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">

        <h1 class="text-2xl md:text-3xl font-bold mb-6">🏋️ Gestion des Disciplines</h1>

        <!-- Formulaire : ajouter une discipline -->
        <form id="form-discipline" class="bg-white p-4 rounded shadow mb-6 flex flex-col md:flex-row gap-3">
            <input type="text" name="libelle" required placeholder="Libellé"
                   class="flex-1 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">

            <input type="text" name="description" required placeholder="Description"
                   class="flex-1 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none">

            <button type="submit" id="btn-submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded
                           disabled:opacity-50 disabled:cursor-not-allowed transition">
                Enregistrer
            </button>
        </form>

        <!-- Tableau : afficher les disciplines -->
        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Libellé</th>
                        <th class="p-3">Description</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <!-- Toasts -->
        <div id="toasts" class="fixed bottom-4 right-4 flex flex-col gap-2"></div>

    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
