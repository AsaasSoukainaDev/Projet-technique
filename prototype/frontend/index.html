<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestion des disciplines</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white">

    <div class="w-4/5 mx-auto py-10">

        <!-- Header -->

        <div class="flex justify-between items-center mb-8">

            <div>
                <h1 class="text-2xl font-bold">
                    Gestion des disciplines
                </h1>

                <p class="text-gray-400 mt-1">
                    Gérer les disciplines de la salle de sport
                </p>
            </div>

            <button
                id="btnAjouter"
                class="bg-white text-black px-5 py-2 rounded font-semibold"
            >
                + Ajouter
            </button>

        </div>


        <!-- Formulaire -->

        <div
            id="formContainer"
            style="display: none;"
            class="bg-gray-900 p-6 rounded-lg mb-8"
        >

            <h2 class="text-xl font-bold mb-5">
                Ajouter une discipline
            </h2>

            <form id="formDiscipline">

                <label class="block mb-2">
                    Libellé
                </label>

                <input
                    type="text"
                    id="libelle"
                    placeholder="Ex : Yoga"
                    class="w-full bg-black border border-gray-700 p-3 rounded mb-5"
                >


                <label class="block mb-2">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Description de la discipline"
                    class="w-full bg-black border border-gray-700 p-3 rounded mb-5"
                ></textarea>


                <div class="flex gap-2">

                    <button
                        type="submit"
                        class="bg-white text-black px-5 py-2 rounded"
                    >
                        Enregistrer
                    </button>

                    <button
                        type="button"
                        id="btnAnnuler"
                        class="border border-gray-600 px-5 py-2 rounded"
                    >
                        Annuler
                    </button>

                </div>

            </form>

        </div>


        <!-- Tableau -->

        <div class="bg-gray-900 rounded-lg overflow-hidden">

            <div class="p-5 border-b border-gray-700">

                <h2 class="text-lg font-semibold">
                    Liste des disciplines
                </h2>

            </div>


            <table class="w-full">

                <thead class="bg-gray-800">

                    <tr>

                        <th class="text-left px-6 py-4">
                            ID
                        </th>

                        <th class="text-left px-6 py-4">
                            Libellé
                        </th>

                        <th class="text-left px-6 py-4">
                            Description
                        </th>

                    </tr>

                </thead>


                <tbody id="tableBody">

                    <!-- Les données seront ajoutées par JavaScript -->

                </tbody>

            </table>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
